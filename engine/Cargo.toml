[package]
name = "lusion-engine"
version = "0.1.0"
edition = "2021"
description = "Pointer dynamics (Rust) + stable-fluids solver (C++) compiled into one WebAssembly module."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
